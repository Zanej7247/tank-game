<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2P Tactical Tank Duel</title>
  <!-- PeerJS CDN for WebRTC P2P Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui-panel {
      background: #1e1e1e;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input, button {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
      font-size: 14px;
    }
    button {
      background: #007acc;
      cursor: pointer;
      border: none;
      font-weight: bold;
    }
    button:hover { background: #005999; }
    #status { font-weight: bold; color: #ffcc00; }
    #game-container {
      position: relative;
    }
    canvas {
      background: #25282a;
      border: 3px solid #444;
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      display: block;
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <div><strong>Your ID:</strong> <span id="my-id">Generating...</span></div>
    <div>
      <input type="text" id="join-id" placeholder="Enter Host Peer ID">
      <button id="connect-btn">Join Match</button>
    </div>
    <div id="status">Status: Waiting for connection...</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const myIdEl = document.getElementById('my-id');
const joinInput = document.getElementById('join-id');
const connectBtn = document.getElementById('connect-btn');
const statusEl = document.getElementById('status');

// Networking state
let peer = new Peer();
let conn = null;
let isHost = false;
let gameStarted = false;

// Input tracking
const keys = {};
let mouseX = 0;
let mouseY = 0;

// Game entities
class Tank {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.chassisAngle = 0;
    this.turretAngle = 0;
    this.speed = 0;
    this.maxSpeed = 2.5;
    this.hp = 100;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    // Render Chassis
    ctx.save();
    ctx.rotate(this.chassisAngle);
    ctx.fillStyle = this.color;
    ctx.fillRect(-20, -15, 40, 30); // Body
    ctx.fillStyle = '#000';
    ctx.fillRect(-22, -18, 44, 5);  // Top Tread
    ctx.fillRect(-22, 13, 44, 5);   // Bottom Tread
    ctx.restore();

    // Render Turret
    ctx.save();
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = '#111';
    ctx.fillRect(0, -4, 28, 8);     // Cannon Barrel
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2); // Turret Base
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Render Health Bar
    ctx.restore();
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(this.x - 25, this.y - 30, 50, 6);
    ctx.fillStyle = '#00ff00';
    ctx.fillRect(this.x - 25, this.y - 30, (this.hp / 100) * 50, 6);
  }
}

class Bullet {
  constructor(x, y, angle, owner) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * 7;
    this.vy = Math.sin(angle) * 7;
    this.owner = owner;
    this.alive = true;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.alive = false;
    }
  }

  draw() {
    ctx.fillStyle = '#fff000';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Local Player & Remote Player setups
let localTank = new Tank(100, 300, '#00a8ff');
let remoteTank = new Tank(700, 300, '#e84118');
let bullets = [];

// Initialize PeerJS
peer.on('open', (id) => {
  myIdEl.textContent = id;
});

peer.on('connection', (connection) => {
  conn = connection;
  isHost = true;
  setupNetworkHandlers();
  statusEl.textContent = "Status: Connected! You are Host (Blue)";
  gameStarted = true;
});

connectBtn.addEventListener('click', () => {
  const targetId = joinInput.value.trim();
  if (!targetId) return;
  conn = peer.connect(targetId);
  isHost = false;
  // Swap positions for Client
  localTank.x = 700;
  localTank.color = '#e84118';
  remoteTank.x = 100;
  remoteTank.color = '#00a8ff';
  
  setupNetworkHandlers();
  statusEl.textContent = "Status: Connected! You are Client (Red)";
  gameStarted = true;
});

function setupNetworkHandlers() {
  conn.on('data', (data) => {
    if (data.type === 'state') {
      remoteTank.x = data.x;
      remoteTank.y = data.y;
      remoteTank.chassisAngle = data.chassisAngle;
      remoteTank.turretAngle = data.turretAngle;
      remoteTank.hp = data.hp;
    } else if (data.type === 'shoot') {
      bullets.push(new Bullet(data.x, data.y, data.angle, 'remote'));
    }
  });
}

// Controls & Inputs
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

canvas.addEventListener('click', () => {
  if (!gameStarted || localTank.hp <= 0) return;
  
  // Fire bullet locally
  const b = new Bullet(localTank.x, localTank.y, localTank.turretAngle, 'local');
  bullets.push(b);

  // Send shot to Peer
  if (conn && conn.open) {
    conn.send({
      type: 'shoot',
      x: localTank.x,
      y: localTank.y,
      angle: localTank.turretAngle
    });
  }
});

// Game Loop
function update() {
  if (gameStarted && localTank.hp > 0) {
    // Chassis Controls
    if (keys['a']) localTank.chassisAngle -= 0.04;
    if (keys['d']) localTank.chassisAngle += 0.04;
    if (keys['w']) {
      localTank.x += Math.cos(localTank.chassisAngle) * localTank.maxSpeed;
      localTank.y += Math.sin(localTank.chassisAngle) * localTank.maxSpeed;
    }
    if (keys['s']) {
      localTank.x -= Math.cos(localTank.chassisAngle) * (localTank.maxSpeed * 0.5);
      localTank.y -= Math.sin(localTank.chassisAngle) * (localTank.maxSpeed * 0.5);
    }

    // Canvas boundary collisions
    localTank.x = Math.max(20, Math.min(canvas.width - 20, localTank.x));
    localTank.y = Math.max(20, Math.min(canvas.height - 20, localTank.y));

    // Turret Tracking Mouse
    localTank.turretAngle = Math.atan2(mouseY - localTank.y, mouseX - localTank.x);

    // Broadcast local tank state
    if (conn && conn.open) {
      conn.send({
        type: 'state',
        x: localTank.x,
        y: localTank.y,
        chassisAngle: localTank.chassisAngle,
        turretAngle: localTank.turretAngle,
        hp: localTank.hp
      });
    }
  }

  // Update Bullets & Collisions
  bullets.forEach(b => {
    b.update();
    
    // Check if opponent hit local tank
    if (b.owner === 'remote' && b.alive) {
      const dist = Math.hypot(b.x - localTank.x, b.y - localTank.y);
      if (dist < 20) {
        localTank.hp = Math.max(0, localTank.hp - 10);
        b.alive = false;
      }
    }
  });

  bullets = bullets.filter(b => b.alive);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  localTank.draw();
  remoteTank.draw();

  bullets.forEach(b => b.draw());

  if (localTank.hp <= 0 || remoteTank.hp <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '36px sans-serif';
    ctx.textAlign = 'center';
    const text = localTank.hp <= 0 ? "You Were Destroyed!" : "Victory! Enemy Eliminated!";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
